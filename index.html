<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1720">
  <title>Approval Status</title>
  <style>
    :root { color-scheme: dark; --bg:#09151b; --panel:#12232a; --text:#f3faf6; --muted:#a9bbb5; --green:#39d98a; --line:#29423c; --amber:#ffd27a; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:24px; display:grid; place-items:center; background:radial-gradient(ellipse at top,#173a32 0,var(--bg) 62%); color:var(--text); font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,440px); }
    .panel { padding:clamp(28px,7vw,42px) 26px; text-align:center; border:1px solid var(--line); border-radius:24px; background:rgba(18,35,42,.97); box-shadow:0 24px 70px #0007; }
    .tick { width:82px; height:82px; margin:0 auto 22px; display:grid; place-items:center; border-radius:50%; background:#123e2c; border:2px solid #2c9e68; color:var(--green); box-shadow:0 0 35px #39d98a25; }
    .tick svg { width:43px; height:43px; }
    h1 { margin:0; font-size:clamp(30px,8vw,38px); letter-spacing:-.04em; }
    .subtitle { margin:9px 0 27px; color:var(--muted); }
    .alert { padding:16px; border:1px solid #705a2f; border-radius:14px; background:#332b1c; color:var(--amber); text-align:left; }
    .alert-title { display:flex; align-items:center; gap:9px; margin:0 0 5px; font-weight:750; }
    .alert p { margin:0; color:#f4dfb5; font-size:14px; }
    .test-note { margin:22px 0 0; color:#849b93; font-size:11px; }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="status-title">
      <div class="tick" role="img" aria-label="Green check mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m5 12.5 4.3 4.3L19.5 6.8" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 id="status-title">Approved</h1>
      <p class="subtitle">Your request status is approved.</p>
      <div class="alert" role="alert">
        <div class="alert-title">
          <span aria-hidden="true">⚠</span>
          <span>Device not supported</span>
        </div>
        <p>Your device is not supported. Please try again using a supported device.</p>
      </div>
      <p class="test-note">Test status screen — no real approval or device check is performed.</p>
    </section>
  </main>
</body>
</html>
